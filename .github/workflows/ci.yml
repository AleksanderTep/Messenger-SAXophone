name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'chore/**', 'fix/**', 'test/**', 'docs/**', 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: local-messenger
          POSTGRES_DB: messenger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://messenger:local-messenger@localhost:5432/messenger_test
      RUN_DB_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - name: Check migration rollback on disposable database
        run: alembic downgrade base && alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failure-evidence
          path: frontend/test-results/
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_API: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral auth secret
        run: echo "AUTH_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Build and start the complete stack
        run: docker compose up --build --wait --wait-timeout 180
      - run: python scripts/smoke.py && python scripts/smoke.py --url http://localhost:8080/api/ready
      - name: Verify UI deep link
        run: curl --fail http://localhost:8080/profile
      - name: Test real registration, login, profile and logout through proxy
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-e2e-failure-evidence
          path: frontend/test-results/
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
