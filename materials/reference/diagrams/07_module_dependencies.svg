<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="626" viewBox="0 0 1000 626"><rect width="1000" height="626" fill="#f4f7fa"/><text x="45" y="43" font-family="Arial" font-size="25">Зависимости упрощённой структуры</text><rect x="45" y="72" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="101" font-family="Arial" font-size="20" font-weight="bold">Frontend</text><text x="65" y="128" font-family="Arial" font-size="17">App.tsx → pages.tsx; App.tsx/pages.tsx → api.ts</text><text x="65" y="154" font-family="Arial" font-size="17">Состояние пользователя в App; страницы получают props</text><rect x="45" y="194" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="223" font-family="Arial" font-size="20" font-weight="bold">HTTP</text><text x="65" y="250" font-family="Arial" font-size="17">api.ts → /api → Nginx → auth.py</text><text x="65" y="276" font-family="Arial" font-size="17">Nginx убирает /api перед FastAPI</text><rect x="45" y="316" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="345" font-family="Arial" font-size="20" font-weight="bold">Backend</text><text x="65" y="372" font-family="Arial" font-size="17">auth.py → users.py / security.py / models.py / db.py</text><text x="65" y="398" font-family="Arial" font-size="17">users.py → security.py / models.py; db.py → PostgreSQL</text><rect x="45" y="438" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="467" font-family="Arial" font-size="20" font-weight="bold">Схема и проверки</text><text x="65" y="494" font-family="Arial" font-size="17">models.py — таблицы; migrations — изменения схемы</text><text x="65" y="520" font-family="Arial" font-size="17">tests/E2E проверяют API, интерфейс и полный сценарий</text><text x="45" y="580" font-family="Arial" font-size="16">Схема относится к PR №3; develop до merge содержит старые пути.</text></svg>
