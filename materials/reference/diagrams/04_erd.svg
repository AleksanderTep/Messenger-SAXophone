<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774"><rect width="1000" height="774" fill="#f4f7fa"/><text x="45" y="43" font-family="Arial" font-size="25">Таблицы и связи фактической схемы</text><rect x="45" y="72" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="101" font-family="Arial" font-size="20" font-weight="bold">users — активная модель</text><text x="65" y="128" font-family="Arial" font-size="17">id PK; username/email UNIQUE + lower UNIQUE; display_name; password_hash</text><text x="65" y="154" font-family="Arial" font-size="17">created_at; updated_at</text><rect x="45" y="194" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="223" font-family="Arial" font-size="20" font-weight="bold">auth_sessions — активная модель</text><text x="65" y="250" font-family="Arial" font-size="17">id PK; user_id FK → users.id; expires_at</text><text x="65" y="276" font-family="Arial" font-size="17">users 1 → N auth_sessions; удаление пользователя удаляет его сессии</text><rect x="45" y="316" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="345" font-family="Arial" font-size="20" font-weight="bold">chats — задел</text><text x="65" y="372" font-family="Arial" font-size="17">id PK; user_low_id/user_high_id FK → users.id; created_at; updated_at</text><text x="65" y="398" font-family="Arial" font-size="17">UNIQUE(user_low_id, user_high_id); CHECK user_low_id &lt; user_high_id</text><rect x="45" y="438" width="910" height="100" rx="8" fill="white" stroke="#31566e"/><text x="65" y="467" font-family="Arial" font-size="20" font-weight="bold">chat_members — задел</text><text x="65" y="494" font-family="Arial" font-size="17">PK(chat_id, user_id); FK → chats.id / users.id; joined_at; last_read_at nullable</text><text x="65" y="520" font-family="Arial" font-size="17">chats 1 → N chat_members; users 1 → N chat_members</text><rect x="45" y="560" width="910" height="126" rx="8" fill="white" stroke="#31566e"/><text x="65" y="589" font-family="Arial" font-size="20" font-weight="bold">messages — задел</text><text x="65" y="616" font-family="Arial" font-size="17">id PK; chat_id; sender_id; body; created_at; updated_at</text><text x="65" y="642" font-family="Arial" font-size="17">FK(chat_id, sender_id) → chat_members(chat_id, user_id)</text><text x="65" y="668" font-family="Arial" font-size="17">CHECK длины trim(body) 1–4000; индекс (chat_id, created_at, id)</text><text x="45" y="728" font-family="Arial" font-size="16">Таблицы чатов не означают работающую переписку: HTTP-сценарии не реализованы.</text></svg>
