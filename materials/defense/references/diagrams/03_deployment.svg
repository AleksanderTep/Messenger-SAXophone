<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="3. Развёртывание через Docker Compose">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#50627b"/></marker></defs>
<rect width="1200" height="690" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#17243c">3. Развёртывание через Docker Compose</text>
<rect x="35" y="120" width="220" height="175" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="51" y="150" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">Хост / браузер</text>
<text x="51" y="178" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">localhost:8080</text>
<text x="51" y="199" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">HTTP /api/...</text>
<text x="51" y="220" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">localhost:8000/docs</text>
<rect x="345" y="120" width="240" height="175" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="361" y="150" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">frontend / Nginx</text>
<text x="361" y="178" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Внутри: 80</text>
<text x="361" y="199" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Снаружи: 8080</text>
<text x="361" y="220" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Статика React + SPA</text>
<rect x="675" y="120" width="235" height="175" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="691" y="150" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">backend / FastAPI</text>
<text x="691" y="178" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Внутри: 8000</text>
<text x="691" y="199" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Снаружи: 8000</text>
<text x="691" y="220" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Alembic перед uvicorn</text>
<rect x="675" y="400" width="235" height="175" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="691" y="430" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">db / PostgreSQL</text>
<text x="691" y="458" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Внутри: db:5432</text>
<text x="691" y="479" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">С хоста: 55432</text>
<text x="691" y="500" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Доступен backend</text>
<rect x="975" y="400" width="195" height="175" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="991" y="430" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">postgres_data</text>
<text x="991" y="458" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Именованный volume</text>
<text x="991" y="479" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Сохраняется при down</text>
<text x="991" y="500" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Удаляется при down -v</text>
<path d="M255 205 L345 205" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="196.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">HTTP</text>
<path d="M585 205 L675 205" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="630.0" y="196.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">/api → /</text>
<path d="M790 295 L790 400" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="790.0" y="338.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">DATABASE_URL</text>
<path d="M910 488 L975 488" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="942.5" y="479.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">данные</text>
<text x="35" y="375" text-anchor="start" font-family="Arial" font-size="16" fill="#26364e">Compose-сеть: backend использует имя db, а не localhost хоста.</text>
<text x="35" y="410" text-anchor="start" font-family="Arial" font-size="16" fill="#26364e">Для параллельного стенда порты задаются переменными окружения.</text>
<text x="35" y="445" text-anchor="start" font-family="Arial" font-size="16" fill="#26364e">Внешний сервер, домен и CD-публикация не настроены.</text>
<text x="36" y="666" text-anchor="start" font-family="Arial" font-size="13" fill="#59697f">Срез develop 674d7ea · подготовлено 28.10.2026 · серые блоки — неработающий задел</text>
</svg>