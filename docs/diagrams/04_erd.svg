<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-label="4. ERD: активные данные и неиспользуемый задел">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#50627b"/></marker></defs>
<rect width="1200" height="1050" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#17243c">4. ERD: активные данные и неиспользуемый задел</text>
<rect x="65" y="100" width="410" height="295" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="81" y="130" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">users — активно</text>
<text x="81" y="158" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK id: UUID</text>
<text x="81" y="179" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">username: String(32), unique</text>
<text x="81" y="200" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">email: String(254), unique</text>
<text x="81" y="221" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">display_name: String(80)</text>
<text x="81" y="242" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">password_hash: Text</text>
<text x="81" y="263" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">created_at, updated_at: timestamptz</text>
<text x="81" y="284" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">unique lower(username), lower(email)</text>
<rect x="665" y="100" width="420" height="180" rx="12" fill="#fff" stroke="#83aaa2" stroke-width="1.5"/>
<text x="681" y="130" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">auth_sessions — активно</text>
<text x="681" y="158" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK id: UUID (jti токена)</text>
<text x="681" y="179" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">FK user_id → users.id (CASCADE)</text>
<text x="681" y="200" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">expires_at: timestamptz + index</text>
<path d="M475 180 L665 180" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="570.0" y="171.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">1 → много</text>
<rect x="65" y="495" width="345" height="220" rx="12" fill="#edf0f4" stroke="#a0a9b8" stroke-width="1.5"/>
<text x="81" y="525" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">chats — задел</text>
<text x="81" y="553" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK id</text>
<text x="81" y="574" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">FK user_low_id → users.id</text>
<text x="81" y="595" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">FK user_high_id → users.id</text>
<text x="81" y="616" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">UNIQUE(low, high), low &lt; high</text>
<text x="81" y="637" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">created_at, updated_at</text>
<rect x="455" y="495" width="310" height="220" rx="12" fill="#edf0f4" stroke="#a0a9b8" stroke-width="1.5"/>
<text x="471" y="525" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">chat_members — задел</text>
<text x="471" y="553" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK/FK chat_id</text>
<text x="471" y="574" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK/FK user_id</text>
<text x="471" y="595" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">joined_at</text>
<text x="471" y="616" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">last_read_at</text>
<rect x="810" y="495" width="330" height="265" rx="12" fill="#edf0f4" stroke="#a0a9b8" stroke-width="1.5"/>
<text x="826" y="525" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">messages — задел</text>
<text x="826" y="553" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">PK id; FK chat_id</text>
<text x="826" y="574" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">sender_id</text>
<text x="826" y="595" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">FK (chat_id, sender_id)</text>
<text x="826" y="616" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">→ chat_members</text>
<text x="826" y="637" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">body: 1–4000 после trim</text>
<text x="826" y="658" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">created_at, updated_at</text>
<text x="826" y="679" text-anchor="start" font-family="Arial" font-size="14" fill="#26364e">Индекс истории: chat/date/id</text>
<path d="M410 595 L455 595" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M765 595 L810 595" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M240 395 L240 495" fill="none" stroke="#50627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="436.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#26364e">users → chats</text>
<text x="65" y="835" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">Таблицы переписки есть в миграции 0001, но endpoint и рабочая отправка отсутствуют.</text>
<text x="65" y="875" text-anchor="start" font-family="Arial" font-size="17" fill="#26364e">0002 добавляет auth_sessions и индексы уникальности без учёта регистра.</text>
<text x="65" y="915" text-anchor="start" font-family="Arial" font-size="15" fill="#26364e">Схема текущая: users/auth_sessions используются; серые таблицы не являются готовым функционалом.</text>
<text x="36" y="1026" text-anchor="start" font-family="Arial" font-size="13" fill="#59697f">Срез develop 674d7ea · подготовлено 28.10.2026 · серые блоки — неработающий задел</text>
</svg>